<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f6fc" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("scandizzo-theme"); } catch {}
        const theme = saved === "light" || saved === "dark" ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#080e20" : "#f3f6fc";
      })();
    </script>
    <meta
      name="description"
      content="Chaveiros, personalizados e produtos em impressão 3D. Conheça a SCANDIZZO 3D e solicite seu orçamento."
    />
    <title>SCANDIZZO 3D · Chaveiros e impressão 3D</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scandizzo 3D" />
    <script type="module" crossorigin src="/assets/index-D3ebzfCy.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
